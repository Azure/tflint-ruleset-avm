version: 2
updates:
- package-ecosystem: gomod
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  groups:
    go-version-updates:
      applies-to: version-updates
      patterns:
      - "*"
    go-security-updates:
      applies-to: security-updates
      patterns:
      - "*"
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: weekly
  groups:
    github-actions-version-updates:
      applies-to: version-updates
      patterns:
      - "*"
    github-actions-security-updates:
      applies-to: security-updates
      patterns:
      - "*"
