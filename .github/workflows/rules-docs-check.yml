---
name: Rules Docs Check

on:
  pull_request:
    types: ['opened', 'synchronize']
    paths:
      - 'rules/**'
      - 'interfaces/**'
      - 'outputs/**'
      - 'common/**'
      - 'cmd/rulesdoc/**'
      - 'generate.go'
      - 'README.md'
      - 'RULES.md'
      - 'scripts/update-readme.sh'
      - '.github/workflows/rules-docs-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-rules-docs:
    name: Verify RULES.md and README rules section are up to date
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'

      - name: Regenerate docs
        run: ./scripts/update-readme.sh

      - name: Fail if docs are out of date
        run: |
          if [[ -n "$(git status --porcelain README.md RULES.md)" ]]; then
            echo "::error::README.md or RULES.md is out of date. Run './scripts/update-readme.sh' locally and commit the result."
            echo "--- diff ---"
            git --no-pager diff --color=never README.md RULES.md
            exit 1
          fi
          echo "README.md and RULES.md are up to date."
