---
name: attest release checksums
run-name: Attest ${{ inputs.tag }} checksums

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published pre-release tag to attest, for example v0.18.0
        required: true
        type: string

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: attest-release-checksums-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  attest:
    name: Attest checksums.txt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ inputs.tag }}

      - name: Download pre-release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if ($env:TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid release tag: $env:TAG"
          }
          if ($env:GITHUB_REF -ne "refs/tags/$env:TAG") {
            throw "Dispatch this workflow with ref $env:TAG, not $env:GITHUB_REF"
          }

          $release = gh release view $env:TAG `
            --repo $env:GITHUB_REPOSITORY `
            --json isDraft,isPrerelease,tagName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Release $env:TAG was not found"
          }
          if ($release.isDraft -or -not $release.isPrerelease -or $release.tagName -ne $env:TAG) {
            throw "$env:TAG must be a published pre-release"
          }

          gh release download $env:TAG `
            --repo $env:GITHUB_REPOSITORY `
            --pattern 'tflint-ruleset-avm_*.zip' `
            --pattern 'checksums.txt' `
            --dir release-assets
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to download release assets for $env:TAG"
          }

          ./scripts/Test-ReleaseAssets.ps1 -ReleaseDirectory release-assets

      - name: Attest checksums.txt
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/checksums.txt
