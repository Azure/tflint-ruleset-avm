---
name: build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: 'go.mod'
    - name: Run tests
      run: make test
    - name: Run build
      run: make build
    - name: Test release asset packaging
      if: runner.os == 'Linux'
      shell: pwsh
      run: ./scripts/Invoke-ReleaseAssetTests.ps1
    - name: Test release asset downloads
      if: runner.os == 'Linux'
      shell: pwsh
      run: ./scripts/Invoke-ReleaseDownloadTests.ps1
