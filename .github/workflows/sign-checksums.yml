---
name: sign-checksums

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose checksums.txt should be attested, e.g. v0.18.0
        required: true

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  sign:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout signing scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          $parameters = @{
            Tag = $env:TAG
            Repository = $env:GITHUB_REPOSITORY
            OutputDirectory = 'release-assets'
          }
          if ($env:RELEASE_ID) {
            $parameters.ReleaseId = [long] $env:RELEASE_ID
          }
          ./scripts/Save-ReleaseAssets.ps1 @parameters

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          path: release-source

      - name: Validate release assets
        run: ./release-source/scripts/Test-ReleaseAssets.ps1 -ReleaseDirectory release-assets

      - name: Attest checksums.txt
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release-assets/checksums.txt
